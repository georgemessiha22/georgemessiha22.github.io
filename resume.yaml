  business-critical, distributed backend systems in Golang. Proven leader in
  driving complex technical initiatives, from migrating legacy monoliths to
  resilient microservice ecosystems to defining technical roadmaps that align
  with strategic business goals. Expert in setting organization-wide best
  practices for system design, observability, and high-performance computing.
  Adept at mentoring senior engineers and guiding multiple teams to solve
  ambiguous, large-scale technical challenges, directly impacting system
  performance, developer velocity, and platform stability.

