summary: >-
  Lead Software Engineer with 9+ years designing and scaling business-critical,
  distributed backend systems in Go. Track record of leading teams through
  high-stakes initiatives — decomposing legacy monoliths into resilient
  microservices, running zero-downtime data migrations, and hardening systems
  for resilience and observability. Leads by raising the engineering bar:
  defining the system-design and testing standards other teams adopt, mentoring
  senior engineers, and aligning technical roadmaps to business goals to improve
  system performance, developer velocity, and platform stability.

